<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Appointments - HealthDesk</title>

    <link rel="stylesheet" href="style.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e8b57">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="HealthDesk">

</head>

<body>

    <!-- HEALTHDESK HEADER -->

    <header class="top-header">

        <div class="header-logo">
            <img src="icon-192.png" alt="HealthDesk Logo">
        </div>

        <div class="header-title">
            <h1>HEALTHDESK</h1>
            <p>School Clinic</p>
        </div>

        <button id="installBtn" class="install-btn">
            📱 Download App
        </button>

    </header>


    <!-- NAVIGATION -->

    <nav class="page-nav">

        <a href="dashboard.html">
            Home
        </a>

        <a href="appointment.html">
            Book Appointment
        </a>

        <a href="appointments.html">
            My Appointments
        </a>

        <button id="logoutBtn">
            Log Out
        </button>

    </nav>


    <main class="appointments-container">

        <h1>
            My Appointments
        </h1>

        <p>
            View and manage your school clinic appointments.
        </p>


        <!-- JavaScript displays appointments here -->

        <div id="appointmentsList"></div>

    </main>


    <script src="script.js"></script>


    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker.register("./service-worker.js");

            });

        }

    </script>

</body>

</html>
